---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: incident-ai

---
# ConfigMap for non-secret config
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-ai-config
  namespace: incident-ai
data:
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  API_LOG_LEVEL: "info"
  VECTOR_STORE_BACKEND: "qdrant"
  RETRIEVER_TOP_K: "5"
  LLM_TEMPERATURE: "0.2"
  BEDROCK_LLM_MODEL_ID: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
  BEDROCK_EMBEDDING_MODEL_ID: "amazon.titan-embed-text-v2:0"
  QDRANT_URL: "https://8513b425-0e74-4bf6-8b2c-c84437afbd21.us-west-1-0.aws.cloud.qdrant.io"
  QDRANT_COLLECTION: "incident_knowledge"

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-ai-api
  namespace: incident-ai
  labels:
    app: incident-ai-api
    version: "0.1.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-ai-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: incident-ai-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: incident-ai-sa   # IRSA for Bedrock access
      containers:
        - name: api
          image: 646966486357.dkr.ecr.us-east-2.amazonaws.com/incident-remediation-ai:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: incident-ai-config
            - secretRef:
                name: incident-ai-secrets   # QDRANT_API_KEY, etc.
          env:
            - name: AWS_REGION
              value: "us-east-2"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 5

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: incident-ai-api
  namespace: incident-ai
spec:
  selector:
    app: incident-ai-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incident-ai-api-hpa
  namespace: incident-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: incident-ai-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ServiceAccount with IRSA annotation for Bedrock
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-ai-sa
  namespace: incident-ai
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::646966486357:role/incident-ai-bedrock-role
