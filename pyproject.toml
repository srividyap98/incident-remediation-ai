[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-remediation-ai"
version = "2.0.0"
description = "Multi-Agent GenAI System for Incident Remediation & Risk Intelligence"
requires-python = ">=3.11"
dependencies = [
    # LangGraph + LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",

    # AWS
    "boto3>=1.35.0",
    "botocore>=1.35.0",

    # Vector stores
    "faiss-cpu>=1.8.0",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.2.0",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Data / ML
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.17.0",

    # Observability — OTel
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "prometheus-client>=0.21.0",

    # Utilities
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
observability = [
    # Arize Phoenix LLM observability
    "arize>=7.0.0",
    # Honeycomb OTel exporter (use standard OTLP exporter with Honeycomb endpoint)
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
pipelines = [
    "apache-airflow>=2.10.0",
    "pyspark>=3.5.0",
]
offline = [
    "sentence-transformers>=3.0.0",  # For OFFLINE_MODE local embeddings, no AWS needed
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "moto[bedrock,s3]>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "sentence-transformers>=3.0.0",  # For OFFLINE_MODE local embeddings, no AWS needed
]

[tool.setuptools.packages.find]
include = ["agents*", "api*", "rag*", "pipelines*", "config*", "monitoring*", "evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
