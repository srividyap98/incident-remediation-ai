name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy agents/ api/ rag/ config/ monitoring/ evaluation/
        continue-on-error: true # pre-existing strict-mode gaps tracked separately, not a merge gate yet

      - name: Unit + integration tests
        env:
          OFFLINE_MODE: "true"
        run: pytest tests/unit tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push — just verifies the Dockerfile compiles)
        run: docker build -t incident-ai:ci-check .

  typescript-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install
      - run: npx tsc --noEmit
