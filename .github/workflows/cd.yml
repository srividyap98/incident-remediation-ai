name: CD

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: incident-remediation-ai
  EKS_CLUSTER: incident-ai-demo
  K8S_NAMESPACE: incident-ai
  K8S_DEPLOYMENT: incident-ai-api

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::646966486357:role/incident-ai-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Deploy new image
        id: deploy
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image deployment/"$K8S_DEPLOYMENT" \
            api="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=600s

      # Validated against a local kind cluster: maxUnavailable:0 means old,
      # healthy pods keep serving traffic the whole time a bad rollout is
      # stuck (nothing in prod goes down) — this step's job is to stop the
      # bad ReplicaSet from sitting there half-deployed and put the
      # Deployment spec itself back to the last known-good revision.
      - name: Roll back on failed rollout
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "::warning::Rollout of $IMAGE_TAG failed health checks — rolling back to the previous revision"
          kubectl rollout undo deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=300s
          echo "::error::Deploy of $IMAGE_TAG failed and was automatically rolled back. Investigate before retrying — this job is still marked failed on purpose."
